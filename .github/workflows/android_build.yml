name: Build Android APK

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial for creating releases

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Extract Tag Name
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
          -PVERSION_NAME=${{ steps.get_version.outputs.VERSION }} \
          -PVERSION_CODE=${{ github.run_number }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v2  # Bumped to v2
        id: sign_app
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 34.0.0  # <--- Add this line!



      # NEW: Uploads the APK so you can download it from the Actions tab on regular commits
#      - name: Upload APK Artifact
#        uses: actions/upload-artifact@v4
#        with:
#          name: app-release-signed
#          # Use the env variable created by the signing step
#          path: ${{ env.ANDROID_SIGNED_FILE }}
#          retention-days: 14

      # Existing: Creates a public release ONLY when you push a tag like v1.0.0
      - name: Create Release and Upload APK
        # if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.signedFile }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

#      - name: Debug output
#        run: echo "${{ steps.sign_app.outputs.signedReleaseFile }}"